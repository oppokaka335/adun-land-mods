name: build-modpack

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Existing modpack release to clone
        required: true
        default: v0.1.2
      jars_tag:
        description: Staging release with extra jars
        required: true
        default: v0.1.3-jars
      out_tag:
        description: New modpack tag
        required: true
        default: v0.1.3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Assemble zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work jars
          gh release download "${{ inputs.base_tag }}" --repo oppokaka335/adun-land-mods --dir work
          BASE_ZIP=$(ls work/*.zip | head -n1)
          mkdir -p pack
          unzip -q "$BASE_ZIP" -d pack
          gh release download "${{ inputs.jars_tag }}" --repo oppokaka335/adun-land-mods --dir jars
          cp -f jars/*.jar pack/
          rm -f adun-land-mods.zip
          (cd pack && zip -qr ../adun-land-mods.zip .)
          ls -lah adun-land-mods.zip
          unzip -l adun-land-mods.zip | grep -E 'Forgematica|MaFgLib' || (echo missing jars && exit 1)
          if gh release view "${{ inputs.out_tag }}" --repo oppokaka335/adun-land-mods >/dev/null 2>&1; then
            gh release delete "${{ inputs.out_tag }}" --repo oppokaka335/adun-land-mods --yes --cleanup-tag
          fi
          gh release create "${{ inputs.out_tag }}" adun-land-mods.zip \
            --repo oppokaka335/adun-land-mods \
            --title "Adun Land modpack ${{ inputs.out_tag }}" \
            --notes "Adds Forgematica 0.1.13 + MaFgLib for Forge 1.20.1." \
            --latest
