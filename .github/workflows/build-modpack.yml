name: build-modpack

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Existing modpack release to clone
        required: true
        default: v0.1.4
      jars_tag:
        description: Staging release with extra jars
        required: true
        default: v0.1.5-jars
      out_tag:
        description: New modpack tag
        required: true
        default: v0.1.5

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Assemble zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work jars
          gh release download "${{ inputs.base_tag }}" --repo oppokaka335/adun-land-mods --dir work
          BASE_ZIP=$(ls work/*.zip | head -n1)
          mkdir -p pack
          unzip -q "$BASE_ZIP" -d pack
          gh release download "${{ inputs.jars_tag }}" --repo oppokaka335/adun-land-mods --dir jars
          # Drop previous Forgematica / MaFgLib only when staging replaces them.
          if compgen -G "jars/Forgematica-*.jar" > /dev/null || compgen -G "jars/MaFgLib-*.jar" > /dev/null; then
            find pack -maxdepth 2 -type f \( -iname 'Forgematica-*.jar' -o -iname 'MaFgLib-*.jar' \) -print -delete
          fi
          if compgen -G "jars/worldedit*.jar" > /dev/null; then
            find pack -maxdepth 2 -type f -iname 'worldedit*.jar' -print -delete
          fi
          cp -f jars/*.jar pack/
          rm -f adun-land-mods.zip
          (cd pack && zip -qr ../adun-land-mods.zip .)
          ls -lah adun-land-mods.zip
          unzip -l adun-land-mods.zip | grep -E 'Forgematica|MaFgLib' || (echo missing jars && exit 1)
          test "$(unzip -l adun-land-mods.zip | grep -ciE 'Forgematica-.*\.jar')" = "1"
          test "$(unzip -l adun-land-mods.zip | grep -ciE 'MaFgLib-.*\.jar')" = "1"
          if compgen -G "jars/worldedit*.jar" > /dev/null; then
            unzip -l adun-land-mods.zip | grep -iE 'worldedit.*\.jar' || (echo missing worldedit && exit 1)
          fi
          if gh release view "${{ inputs.out_tag }}" --repo oppokaka335/adun-land-mods >/dev/null 2>&1; then
            gh release delete "${{ inputs.out_tag }}" --repo oppokaka335/adun-land-mods --yes --cleanup-tag
          fi
          gh release create "${{ inputs.out_tag }}" adun-land-mods.zip \
            --repo oppokaka335/adun-land-mods \
            --title "Adun Land modpack ${{ inputs.out_tag }}" \
            --notes "Adds WorldEdit 7.2.15 for creative //schem paste. Keeps patched Forgematica/MaFgLib." \
            --latest
